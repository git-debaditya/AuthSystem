name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
  environment:
    name: github-pages
  steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Build
      run: npm run build
    - name: Deploy
      run: npm run deploy
  #url: ${{ steps.deployment.outputs.page_url }}